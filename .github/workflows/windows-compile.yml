name: Windows Compile

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, windows-support]

concurrency:
  group: windows-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Windows compile checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build bridge resource
        run: pnpm build:bridge

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-compile-artifacts
          path: |
            dist
            src-tauri/target/agentbro-bridge-resource
          if-no-files-found: error

  package:
    name: Windows package bundles
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/windows-support'
    needs: compile
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release bridge resource
        run: pnpm build:bridge:release

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Windows installers
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis,msi --ci --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis
            src-tauri/target/release/bundle/msi
          if-no-files-found: error
